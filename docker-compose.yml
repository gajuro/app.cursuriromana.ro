version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: moodle-nginx
    ports:
      - "80:80"
    volumes:
      # Nginx configuration
      - ./nginx.conf:/etc/nginx/conf.d/moodle.conf:ro
      
      # Shared application files (read-only)
      - moodle_app:/var/www/html:ro
      
      # Shared data directory (read-only for nginx, just serving)
      - moodle_data:/var/www/moodledata:ro
      
      # Shared cache (read-only)
      - moodle_localcache:/var/www/localcache:ro
    depends_on:
      php-fpm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile
      target: moodle
    container_name: moodle-php-fpm
    environment:
      # Database configuration
      - MOODLE_DB_TYPE=${DB_TYPE:-mariadb}
      - MOODLE_DB_HOST=${DB_HOST:-db}
      - MOODLE_DB_PORT=${DB_PORT:-3306}
      - MOODLE_DB_NAME=${DB_NAME:-moodle}
      - MOODLE_DB_USER=${DB_USER:-moodle}
      - MOODLE_DB_PASSWORD=${DB_PASSWORD}
      - MOODLE_DB_PREFIX=${DB_PREFIX:-mdl_}
      
      # Moodle configuration
      - MOODLE_WWWROOT=${WWWROOT:-http://localhost}
      - MOODLE_DATAROOT=/var/www/moodledata
      - MOODLE_ADMIN=${ADMIN_USER:-admin}
      - MOODLE_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MOODLE_ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      
      # PHP configuration
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
    volumes:
      # Application code (shared with nginx)
      - moodle_app:/var/www/html:rw
      
      # Persistent config storage (managed by entrypoint script)
      - moodle_config:/var/www/persistent:rw
      
      # Persistent data directory (REQUIRED - stores uploads, cache, sessions)
      - moodle_data:/var/www/moodledata:rw
      
      # Persistent local cache (for better performance)
      - moodle_localcache:/var/www/localcache:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.8
    container_name: moodle-db
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME:-moodle}
      - MARIADB_USER=${DB_USER:-moodle}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-file-per-table=1
      - --max-allowed-packet=256M
      - --innodb-buffer-pool-size=512M
      - --query-cache-size=32M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: moodle-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  # Application code (shared between nginx and php-fpm)
  moodle_app:
    driver: local
  
  # Config persistence (stores config.php via entrypoint)
  moodle_config:
    driver: local
  
  # Moodle data directory (CRITICAL - stores all uploaded files, cache, sessions)
  moodle_data:
    driver: local
  
  # Local cache directory (improves performance)
  moodle_localcache:
    driver: local
  
  # Database volume
  db_data:
    driver: local
  
  # Redis volume (for persistence if enabled)
  redis_data:
    driver: local
