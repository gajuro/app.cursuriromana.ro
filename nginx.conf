server {
    listen 80;
    server_name _;
    
    root /var/www/html/public;
    index index.php index.html;
    
    # Maximum upload size
    client_max_body_size 100M;
    
    # Logging
    access_log /var/log/nginx/moodle-access.log;
    error_log /var/log/nginx/moodle-error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Trust X-Forwarded-Proto from reverse proxy (Coolify)
    # This allows Moodle to detect HTTPS correctly
    map $http_x_forwarded_proto $fastcgi_https {
        default off;
        https on;
    }
    
    # Static files - cache aggressively
    location ~* \.(jpg|jpeg|gif|png|ico|svg|css|js|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Theme assets - cache but allow updates
    location ^~ /theme/ {
        expires 1d;
        access_log off;
        try_files $uri =404;
    }
    
    # Pix (Moodle icons) - cache aggressively
    location ^~ /pix/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ /vendor/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Moodle 4.5+ routing engine
    # Route to r.php if file/directory doesn't exist
    location / {
        try_files $uri $uri/ /r.php?$args;
    }
    
    # Strip /public/ prefix if present (legacy URLs)
    location ^~ /public/ {
        rewrite ^/public/(.*)$ /$1 permanent;
    }
    
    # PHP-FPM processing
    location ~ \.php$ {
        # Security: don't execute PHP in upload directories
        location ~ ^/moodledata/ {
            deny all;
        }
        
        # FastCGI configuration
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $fastcgi_https;
        
        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
        
        # Buffer settings
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    
    # Deny access to .php files in moodledata
    location ~ ^/moodledata/.*\.php$ {
        deny all;
    }
}
