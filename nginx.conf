# Extract port from Host header for development
map $http_host $port_in_host {
    ~^[^\:]+:(?<p>\d+)$ $p;
    default 80;
}

server {
    listen 80;
    server_name _;
    
    root /var/www/html/public;
    index index.php index.html;
    
    # Maximum upload size
    client_max_body_size 100M;
    
    # Logging
    access_log /var/log/nginx/moodle-access.log;
    error_log /var/log/nginx/moodle-error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Static files - cache aggressively (including theme assets and icons)
    location ~* \.(jpg|jpeg|gif|png|ico|svg|css|js|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Deny access to sensitive files and directories (Moodle security)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to internal/sensitive directories
    location ~ /(vendor|node_modules|.git|.vscode) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to composer files
    location ~ composer\.(json|lock)$ {
        deny all;
        access_log off;
    }
    
    # Deny access to environment files
    location ~ \.env$ {
        deny all;
        access_log off;
    }
    
    # Moodle 4.5+ routing engine
    # Route to r.php if file/directory doesn't exist
    location / {
        try_files $uri $uri/ /r.php;
    }
    
    # Strip /public/ prefix if present (legacy URLs)
    location ^~ /public/ {
        rewrite ^/public/(.*)$ /$1 permanent;
    }
    
    # Deny access to moodledata directory
    location ^~ /moodledata/ {
        internal;
        deny all;
    }
    
    # PHP-FPM processing
    location ~ \.php(/|$) {
        # Split the path info based on URI.
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        # Note: Store the original path_info. It will be wiped out in a moment by try_files.
        set $path_info $fastcgi_path_info;
        # Look for the php file. If not found then jump to @routed.
        try_files $fastcgi_script_name $fastcgi_script_name/;
        # File was found – pass to fastcgi.
        fastcgi_pass   127.0.0.1:9000;
        include        fastcgi_params;
        # Re-apply the path_info after including fastcgi_params.
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        
        # Override host/port params to include port number for Moodle
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_NAME $http_host;
        fastcgi_param SERVER_PORT $port_in_host;
        
        # Pass X-Forwarded headers to PHP (for reverse proxy detection)
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        
        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
        
        # Buffer settings
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    
    # Deny access to certain file types in dataroot
    location ~* (\.php$|~$|\.sqlite$|\.log$|\.sql$) {
        if ($request_uri ~ "^/moodledata/") {
            return 404;
        }
    }
}
