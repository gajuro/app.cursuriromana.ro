server {
    listen 80;
    server_name _;
    
    root /var/www/html/public;
    index index.php index.html;
    
    # Maximum upload size
    client_max_body_size 100M;
    
    # Logging
    access_log /var/log/nginx/moodle-access.log;
    error_log /var/log/nginx/moodle-error.log;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Static files - cache aggressively
    location ~* \.(jpg|jpeg|gif|png|ico|svg|css|js|woff|woff2|ttf|eot|map)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Theme assets - cache but allow updates
    location ^~ /theme/ {
        expires 1d;
        access_log off;
        try_files $uri =404;
    }
    
    # Pix (Moodle icons) - cache aggressively
    location ^~ /pix/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
    
    # Deny access to sensitive files and directories (Moodle security)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to internal/sensitive directories
    location ~ /(vendor|node_modules|.git|.vscode) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to composer files
    location ~ composer\.(json|lock)$ {
        deny all;
        access_log off;
    }
    
    # Deny access to environment files
    location ~ \.env$ {
        deny all;
        access_log off;
    }
    
    # Moodle 4.5+ routing engine
    # Route to r.php if file/directory doesn't exist
    location / {
        try_files $uri $uri/ /r.php?$args;
    }
    
    # Strip /public/ prefix if present (legacy URLs)
    location ^~ /public/ {
        rewrite ^/public/(.*)$ /$1 permanent;
    }
    
    # Deny access to moodledata directory
    location ^~ /moodledata/ {
        internal;
        deny all;
    }
    
    # PHP-FPM processing
    location ~ [^/]\.php(/|$) {
        
        # Security check - prevent execution of PHP in wrong places
        try_files $uri =404;
        
        # FastCGI configuration
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Pass X-Forwarded-Proto to PHP (for HTTPS detection behind Coolify reverse proxy)
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        
        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;
        
        # Buffer settings
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    
    # Deny access to certain file types in dataroot
    location ~* (\.php$|~$|\.sqlite$|\.log$|\.sql$) {
        if ($request_uri ~ "^/moodledata/") {
            return 404;
        }
    }
}
